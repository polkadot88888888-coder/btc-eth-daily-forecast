name: deploy-site

# Собирает дашборд site/index.html и публикует на GitHub Pages. Запускается
# после каждого коммита в main (ежедневный отчёт, макро-снимок) и вручную.
# Всё в облаке GitHub — ноутбук не нужен.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dashboard
        run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
