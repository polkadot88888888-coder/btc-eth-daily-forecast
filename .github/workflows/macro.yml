name: macro-snapshot

# Тянет макро (акции, доходности, доллар, нефть, VIX) из FRED и кладёт снимок в
# data/macro.json. Запускается до ежедневной рутины прогноза (она в 12:08 UTC),
# чтобы та прочитала свежий снимок из склонированного репозитория.

on:
  schedule:
    - cron: '0 11 * * *'   # каждый день 11:00 UTC (~1 ч до рутины)
  workflow_dispatch: {}    # можно запустить вручную кнопкой

permissions:
  contents: write

concurrency:
  group: macro-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch macro snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/macro.py

      - name: Commit and push
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/macro.json
          if git diff --staged --quiet; then
            echo "No changes in macro.json"
          else
            git commit -m "Макро-снимок $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi
