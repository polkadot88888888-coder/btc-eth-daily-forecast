name: macro-snapshot

# Тянет макро (акции, доходности, доллар, нефть, VIX) из FRED и кладёт снимок в
# data/macro.json. Запускается до ежедневной рутины прогноза (она в 12:08 UTC),
# чтобы та прочитала свежий снимок из склонированного репозитория.

on:
  schedule:
    - cron: '0 11 * * *'   # каждый день 11:00 UTC (~1 ч до рутины)
  workflow_dispatch: {}    # можно запустить вручную кнопкой

permissions:
  contents: write

concurrency:
  group: macro-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch macro snapshot (FRED)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/macro.py

      - name: Fetch cross-asset (gold, forex, BTC↔Nasdaq)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/crossasset.py || echo "crossasset failed, skip"

      - name: Fetch derivatives (OI, liquidations, funding)
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python3 scripts/derivs.py || echo "derivs failed, skip"

      - name: Commit and push
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/macro.json data/crossasset.json data/crossasset_state.json \
                  data/derivs.json data/derivs_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Снимок данных $(date -u +%Y-%m-%d) (макро + кросс-активы + деривативы)"
            git pull --rebase --autostash origin main || true
            git push
          fi
